# CAT on RT-DETRv2 (docs/BASELINES_RTDETR.md §2.3, docs/baselines/CAT_SPEC.md).
# Cascade: localisation pass (RT-DETRv2 decoder: boxes + foreground objectness) then identification pass (second
# decoder, query_pos = localisation embedding, content 0, reference = localisation boxes) -> 20 known + unknown logits.
# Pseudo-unknowns: top-5 unmatched queries per image and layer by the self-adaptive score of the OW-DETR attention
# activation and the overlap with selective-search boxes, from epoch 5; classification + objectness losses only.
# Objectness weight 0.5 (CAT cls 2 : obj 1, rescaled to VFL weight 1); not used at inference.
__include__: ['../include/rtdetrv2_r50_ow.yml']
output_dir: ./outputs/b_cat_rt
num_classes: 21
model: OWRTDETR
OWRTDETR:
  backbone: PResNet
  encoder: HybridEncoder
  decoder: OWRTDETRTransformerv2
  attn_map_level: 1
OWRTDETRTransformerv2:
  use_nc_obj: True
  cat_cascade: True
OWCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_ncobj: 0.5}
  losses: ['vfl', 'boxes', 'ncobj']
  attn_pseudo_k: 5
  attn_pseudo_start: 5
  cat_ss: True
  cat_tb: 40
train_dataloader:
  dataset:
    ss_file: data/mowodb/t1_train_ss.json
OWPostProcessor:
  unk_score: cls_last
  known_score: cls
  unk_weight: 1.0
