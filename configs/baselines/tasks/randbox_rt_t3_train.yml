# randbox_rt, M-OWODB Task 3 stage 1 (scripts/make_baseline_task_configs.py): from the Task-2 model with the
# classifier grown to 60 known classes (tools/expand_classes.py), 10 epochs on owod_t3_train labelled with
# Task 3's 20 classes only, lr 0.1x.
__include__: ['../randbox_rt.yml']
output_dir: ./outputs/randbox_rt_t3/train
num_classes: 61
epoches: 10
owod_eval:
  num_known: 60
  prev_known: 40
OWCriterion:
  randbox_unk_start: 0
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.000001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    ann_file: data/mowodb/t3_train.json
    num_known: 60
    transforms:
      policy:
        epoch: 8
  collate_fn:
    stop_epoch: 8
val_dataloader:
  dataset:
    num_known: 60
