# cat_rt, M-OWODB Task 2 stage 1 (scripts/make_baseline_task_configs.py): from the Task-1 model with the
# classifier grown to 40 known classes (tools/expand_classes.py), 10 epochs on owod_t2_train labelled with
# Task 2's 20 classes only, lr 0.1x.
__include__: ['../cat_rt.yml']
output_dir: ./outputs/cat_rt_t2/train
num_classes: 41
epoches: 10
owod_eval:
  num_known: 40
  prev_known: 20
OWCriterion:
  attn_pseudo_start: 0
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.000001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    ann_file: data/mowodb/t2_train.json
    num_known: 40
    ss_file: data/mowodb/t2_train_ss.json
    transforms:
      policy:
        epoch: 8
  collate_fn:
    stop_epoch: 8
val_dataloader:
  dataset:
    num_known: 40
