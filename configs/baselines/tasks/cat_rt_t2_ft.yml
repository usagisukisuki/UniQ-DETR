# cat_rt, M-OWODB Task 2 stage 2 (scripts/make_baseline_task_configs.py): fine-tuning of stage 1 on ORE's
# exemplar set owod_t2_ft, all 40 known classes labelled, 60 epochs, 0.1x lr after 40 (PROB t2_ft).
__include__: ['./cat_rt_t2_train.yml']
output_dir: ./outputs/cat_rt_t2/ft
epoches: 60
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [40]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
train_dataloader:
  dataset:
    ann_file: data/mowodb/t2_ft.json
    ss_file: data/mowodb/t2_ft_ss.json
    transforms:
      policy:
        epoch: 58
  collate_fn:
    stop_epoch: 58
