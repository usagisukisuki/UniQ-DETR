# owdetr_rt, M-OWODB Task 4 stage 1 (scripts/make_baseline_task_configs.py): from the Task-3 model with the
# classifier grown to 80 known classes (tools/expand_classes.py), 10 epochs on owod_t4_train labelled with
# Task 4's 20 classes only, lr 0.1x.
__include__: ['../owdetr_rt.yml']
output_dir: ./outputs/owdetr_rt_t4/train
num_classes: 81
epoches: 10
owod_eval:
  num_known: 80
  prev_known: 60
OWCriterion:
  attn_pseudo_start: 0
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.000001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.00001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

train_dataloader:
  dataset:
    ann_file: data/mowodb/t4_train.json
    num_known: 80
    transforms:
      policy:
        epoch: 8
  collate_fn:
    stop_epoch: 8
val_dataloader:
  dataset:
    num_known: 80
