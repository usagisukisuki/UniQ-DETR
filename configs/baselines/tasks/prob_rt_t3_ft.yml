# prob_rt, M-OWODB Task 3 stage 2 (scripts/make_baseline_task_configs.py): fine-tuning of stage 1 on ORE's
# exemplar set owod_t3_ft, all 60 known classes labelled, 60 epochs, 0.1x lr after 35 (PROB t3_ft).
__include__: ['./prob_rt_t3_train.yml']
output_dir: ./outputs/prob_rt_t3/ft
epoches: 60
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [35]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
train_dataloader:
  dataset:
    ann_file: data/mowodb/t3_ft.json
    transforms:
      policy:
        epoch: 58
  collate_fn:
    stop_epoch: 58
