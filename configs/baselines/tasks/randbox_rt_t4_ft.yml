# randbox_rt, M-OWODB Task 4 stage 2 (scripts/make_baseline_task_configs.py): fine-tuning of stage 1 on ORE's
# exemplar set owod_t4_ft, all 80 known classes labelled, 70 epochs, 0.1x lr after 50 (PROB t4_ft).
__include__: ['./randbox_rt_t4_train.yml']
output_dir: ./outputs/randbox_rt_t4/ft
epoches: 70
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [50]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
train_dataloader:
  dataset:
    ann_file: data/mowodb/t4_ft.json
    transforms:
      policy:
        epoch: 68
  collate_fn:
    stop_epoch: 68
