# F1: class-agnostic localisation-quality head (OLN-style, no background negatives); unknown = o * sigmoid(u) * q.
# Fine-tuned from E2 for 10 epochs (-t outputs/e2_obj/best.pth).
__include__: ['./e2_obj.yml']
output_dir: ./outputs/f1_quality
epoches: 10
OWRTDETRTransformerv2:
  use_quality: True
OWCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_obj: 0.3, loss_unk: 1, loss_quality: 1}
  losses: ['vfl', 'boxes', 'obj', 'unk', 'quality']
  quality_min_iou: 0.3
OWPostProcessor:
  unk_score: learned_q
