# UniQ-DETR, M-OWODB Task 2 stage 2 (README, Tasks 2-4; PROB protocol): fine-tuning of stage 1 on ORE's balanced
# exemplar set owod_t2_ft, all 40 known classes labelled, 60 epochs at the Task-1 lr with a 0.1x drop after 40
# epochs (PROB t2_ft). Pseudo-unknown boxes from the E2 epoch-2 teacher minus the GT.
__include__: ['./uniq_t2_train.yml']
output_dir: ./outputs/uniq_t2/ft
epoches: 60
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_scheduler:
  type: MultiStepLR
  milestones: [40]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 500
train_dataloader:
  dataset:
    ann_file: data/pseudo_unk/t2_ft_e2ep2_cons_k5.json
    transforms:
      policy:
        epoch: 58
  collate_fn:
    stop_epoch: 58
